<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Lists</title>

    <link rel="stylesheet" href="assets/lyrics.css">
   <link rel="stylesheet" href="assets/setlists.css">

<script defer src="assets/common.js"></script>
<script defer src="assets/sortable.min.js"></script>
<script defer src="assets/setlists.js"></script>   

    

</head>

<body class="default-theme">

    <div id="tempo-frame">

        <div id="song-container">

            <div id="app">
 


<header>

            <nav id="navbar">

                <a id="menu-button" href="#">☰</a>
                 <h1 class="song-title">Set Lists</h1>
 
            </nav>
            
     
               <nav id="burger-menu">

                <div class="menu-section">
                    <h3>Theme</h3>

  <label class="theme-option default-theme-preview" for="theme-default">
      <input type="radio" name="theme" id="theme-default" value="default" checked>
      Default
  </label>
  <label class="theme-option light-theme-preview" for="theme-light">
      <input type="radio" name="theme" id="theme-light" value="light">
      Light
    </label>
  <label class="theme-option dark-theme-preview" for="theme-dark">
      <input type="radio" name="theme" id="theme-dark" value="dark">
      Dark
    </label>
                </div>

                <div class="menu-section">
                    <h3>Options</h3>
  <label class="option-toggle" for="big-tempo">
      <input type="checkbox" name="big-tempo" id="big-tempo">
    Big Tempo
    </label>
  <label class="option-toggle" for="invert-theme">
      <input type="checkbox" name="invert-theme" id="invert-theme">
        Invert Colours
    </label>
                </div>

                <div class="menu-section">
                    <h3>links</h3>
                    <a href="setlists.html">Set Lists</a>
                    <a href="settings.html">Settings</a>
                </div>

            </nav>

        </header>
        
        
<!-- song lists -->

<main id="song-lists">

    <section class="song-list-group">

        <h2>All Songs</h2>

        <div id="all-songs" class="song-list"> </div>

    </section>


    <section class="song-list-group">

        <h2>Current Setlist</h2>

        <div id="current-setlist" class="song-list"> </div>

    </section>


    <div class="song-list-buttons">

        <button
            type="button"
            id="save-setlist"
        >
            Save Setlist
        </button>

    </div>

</main>

<footer>

    Version 0.1-layout

</footer>

            </div>
        </div>
    </div>

</body>

</html>
