<div id="notes-editor" class="hidden">

    <div class="notes-editor-window">

        <h2>Notes Editor</h2>

        <div class="notes-group">

            <h3>Song Notes</h3>

            <textarea
                id="song-notes"
                rows="4">
            </textarea>

        </div>

        <div class="notes-group">

            <h3>Section Notes</h3>

            <table class="notes-table">

                <thead>

                    <tr>

                        <th>Section</th>
                        <th>Note</th>
                        <th></th>

                    </tr>

                </thead>

                <tbody id="section-notes-body">

                </tbody>

            </table>

            <button id="add-section-row">

                + Add Section

            </button>

        </div>

        <div class="notes-group">

            <h3>Line Notes</h3>

            <table class="notes-table">

                <thead>

                    <tr>

                        <th>Line</th>
                        <th>Note</th>
                        <th></th>

                    </tr>

                </thead>

                <tbody id="line-notes-body">

                </tbody>

            </table>

            <button id="add-line-row">

                + Add Line

            </button>

        </div>

        <div class="notes-buttons">

            <button id="cancel-note">

                Cancel

            </button>

            <button id="save-note">

                Save

            </button>

        </div>

    </div>

</div>
